# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "fixly-web"

[setup]
script = '''
cd "$CODEX_WORKTREE_PATH"

corepack enable

pnpm install

pnpm lint

NODE_OPTIONS="--max-old-space-size=4096" pnpm build
'''

[cleanup]
script = ""

[cleanup.darwin]
script = '''
docker compose down --remove-orphans || true
rm -rf .cache/tmp
rm -rf .next/cache
'''

[[actions]]
name = "Lint"
icon = "tool"
command = "pnpm lint"

[[actions]]
name = "Build"
icon = "tool"
command = "NODE_OPTIONS=\"--max-old-space-size=4096\" pnpm build"

[[actions]]
name = "Snapshot"
icon = "tool"
command = "pnpm snapshot"

[[actions]]
name = "Geo validate"
icon = "tool"
command = "pnpm geo:validate:all"
